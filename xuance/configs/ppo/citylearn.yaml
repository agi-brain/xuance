agent: "PPO"  # Choice: PPO, PPO_KL
env_name: "CityLearn"
env_id: null  # Set dynamically via get_runner(..., env_id="<dataset>") or CLI.
env_seed: 1
episode_time_steps: 168  # 1-week hourly simulation horizon (167 transitions).
normalize_obs: True
citylearn_kwargs: {}
render: False
vectorize: "DummyVecEnv"
learner: "PPO_Learner"
policy: "Gaussian_AC"
representation: "Basic_MLP"
runner: "DRL"

representation_hidden_size: [128, ]
actor_hidden_size: [128, ]
critic_hidden_size: [128, ]
activation: "leaky_relu"
activation_action: "tanh"

seed: 1
parallels: 4
running_steps: 100000
horizon_size: 168
n_epochs: 10
n_minibatch: 4
learning_rate: 0.0003

vf_coef: 0.5
ent_coef: 0.01
target_kl: 0.25
kl_coef: 1.0
clip_range: 0.2
gamma: 0.99
use_gae: True
gae_lambda: 0.95
use_advnorm: True

use_grad_clip: True
clip_type: 1
grad_clip_norm: 0.5
use_actions_mask: False
use_obsnorm: False
use_rewnorm: True
obsnorm_range: 5
rewnorm_range: 5

eval_interval: 10000
test_episode: 3
log_dir: "logs/ppo/"
model_dir: "models/ppo/"
