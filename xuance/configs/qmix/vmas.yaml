agent: "QMIX"  # The agent name.
env_name: "vmas"  # The environment name.
env_id: null  # Set dynamically via get_runner(..., env_id="<scenario>") or CLI.
env_seed: 1  # The random seed of the environment.
continuous_action: False  # Discrete control for QMIX.
vmas_device: "cpu"  # Simulation device for VMAS ("cpu" or "cuda").
max_episode_steps: 200  # Horizon per episode (VMAS max_steps).
scenario_kwargs: {}  # Extra scenario arguments forwarded to vmas.make_env.
render: False
learner: "QMIX_Learner"
policy: "Mixing_Q_network"
representation: "Basic_MLP"
vectorize: "NativeVecMultiAgentEnv"  # Uses VMAS's native batched stepping.
runner: "MARL"

use_rnn: False
rnn: "GRU"
N_recurrent_layers: 1
fc_hidden_sizes: [64, ]
recurrent_hidden_size: 64
dropout: 0

representation_hidden_size: [64, ]
q_hidden_size: [64, ]
activation: "relu"
use_parameter_sharing: False
use_actions_mask: False

hidden_dim_mixing_net: 128
hidden_dim_hyper_net: 128

seed: 1
parallels: 32
buffer_size: 100000
batch_size: 256
learning_rate: 0.001
gamma: 0.99
double_q: True

start_greedy: 1.0
end_greedy: 0.05
decay_step_greedy: 250000
start_training: 1000
running_steps: 1000000
training_frequency: 25
sync_frequency: 100

use_grad_clip: False
grad_clip_norm: 0.5

eval_interval: 50000
test_episode: 5

log_dir: "logs/qmix/"
model_dir: "models/qmix/"
