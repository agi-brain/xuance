agent: "SAC"
env_name: "CityLearn"
env_id: null  # Set dynamically via get_runner(..., env_id="<dataset>") or CLI.
env_seed: 1
episode_time_steps: 168
normalize_obs: True
citylearn_kwargs: {}
render: False
vectorize: "DummyVecEnv"
learner: "SAC_Learner"
policy: "Gaussian_SAC"
representation: "Basic_Identical"
runner: "DRL"

representation_hidden_size:
actor_hidden_size: [256, 256]
critic_hidden_size: [256, 256]
activation: "leaky_relu"
activation_action: "tanh"

seed: 1
parallels: 4
buffer_size: 100000
batch_size: 256
learning_rate_actor: 0.0003
learning_rate_critic: 0.0003
gamma: 0.99
alpha: 0.2
use_automatic_entropy_tuning: True
tau: 0.005

training_frequency: 1
running_steps: 100000
start_training: 1000

use_grad_clip: False
clip_type: 1
grad_clip_norm: 0.5
use_actions_mask: False
use_obsnorm: False
use_rewnorm: False
obsnorm_range: 5
rewnorm_range: 5

eval_interval: 10000
test_episode: 3
log_dir: "logs/sac/"
model_dir: "models/sac/"
